apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: travel-app
  labels:
    app: hotel-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hotel-service
        tier: backend
    spec:
      containers:
        - name: hotel-service
          # Images pulled from Docker Hub.
          # IMAGE_REGISTRY is substituted by the Jenkins pipeline / deploy.sh as:
          #   docker.io/<DOCKER_USER>/hotel-service:<tag>
          image: ${IMAGE_REGISTRY}/hotel-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: HOTEL_SERVICE_PORT
              value: "8081"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  namespace: travel-app
  labels:
    app: hotel-service
spec:
  type: ClusterIP
  selector:
    app: hotel-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
