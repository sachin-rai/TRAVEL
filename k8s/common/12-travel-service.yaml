apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-service
  namespace: travel-app
  labels:
    app: travel-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: travel-service
        tier: backend
    spec:
      containers:
        - name: travel-service
          image: ${IMAGE_REGISTRY}/travel-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: travel-app-config
          env:
            - name: TRAVEL_SERVICE_PORT
              value: "8080"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: travel-service
  namespace: travel-app
  labels:
    app: travel-service
spec:
  type: ClusterIP
  selector:
    app: travel-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
