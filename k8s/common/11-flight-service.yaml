apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: travel-app
  labels:
    app: flight-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flight-service
        tier: backend
    spec:
      containers:
        - name: flight-service
          image: ${IMAGE_REGISTRY}/flight-service:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: FLIGHT_SERVICE_PORT
              value: "8082"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: flight-service
  namespace: travel-app
  labels:
    app: flight-service
spec:
  type: ClusterIP
  selector:
    app: flight-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
